<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Strength Practice</title>
  <meta name="theme-color" content="#2f6f68">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Strength">
  <link rel="stylesheet" href="shared/ui.css">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {}));
    }
  </script>
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <script type="module" src="patient/main.js"></script>
  <script>
    // If the app's modules fail to load (e.g. first visit while offline), say so instead of showing a blank page.
    setTimeout(() => { const a = document.getElementById('app');
      if (a && !a.firstChild) a.innerHTML = '<section class="card narrow"><h1>Couldn\u2019t load</h1><p>Check your connection, then pull down or reopen the app to try again.</p></section>'; }, 8000);
  </script>
</body>
</html>
